<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- نسخة الويب للموظفين: سيرفر الكافيه (الكاشير) بيقدّمها على نفس البورت (lib/src/server/web_app.dart) -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Order Ly للموظفين">
  <meta name="theme-color" content="#0F766E">

  <!-- الأيفون: "إضافة للشاشة الرئيسية" بتفتحه زي الأبلكيشن من غير شريط Safari -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Order Ly">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Order Ly</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #F6F5F2; }
    @media (prefers-color-scheme: dark) { html, body { background: #121212; } #loading { color: #ddd; } }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; color: #333; }
    #loading img { width: 84px; height: 84px; border-radius: 20px; }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/Icon-180.png" alt=""><div>Order Ly بيفتح...</div></div>
  <script>
    // أول ما البرنامج يرسم أول شاشة، رسالة التحميل بتختفي
    window.addEventListener('flutter-first-frame', function () { var l = document.getElementById('loading'); if (l) l.remove(); });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
